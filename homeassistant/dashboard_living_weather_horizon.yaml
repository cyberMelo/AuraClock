kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
- title: Comodino
  path: '0'
  panel: true
  background: '#070b14'
  cards:
  - type: custom:button-card
    entity: weather.casa
    triggers_update:
    - sensor.time
    - sensor.temperatura_esterna
    - sensor.meteo_comodino_minmax
    - input_boolean.sveglia_comodino_attiva
    - input_datetime.sveglia_comodino_orario
    show_icon: false
    show_name: false
    tap_action:
      action: call-service
      service: input_boolean.toggle
      target:
        entity_id: input_boolean.sveglia_comodino_attiva
    hold_action:
      action: navigate
      navigation_path: /lovelace-comodino/orario
    styles:
      card:
      - width: 800px
      - height: 480px
      - border-radius: 0px
      - border: none
      - padding: '0'
      - margin: '0'
      - position: relative
      - overflow: hidden
      - zoom: '0.666667'
      - background: "[[[\n  const w = entity.state;\n  if (w === 'rainy' || w ===\
          \ 'pouring')\n    return 'radial-gradient(circle at 50% 0%, rgba(30, 64,\
          \ 175, 0.45) 0%, rgba(15, 23, 42, 0.85) 60%, #050811 100%)';\n  if (w ===\
          \ 'lightning-rainy' || w === 'lightning')\n    return 'radial-gradient(circle\
          \ at 70% 15%, rgba(124, 58, 237, 0.32) 0%, rgba(17, 24, 39, 0.9) 55%, #04060c\
          \ 100%)';\n  if (w === 'clear-night')\n    return 'radial-gradient(circle\
          \ at 80% 20%, rgba(99, 102, 241, 0.25) 0%, rgba(15, 23, 42, 0.6) 50%, #03050a\
          \ 100%)';\n  if (w === 'snowy' || w === 'snowy-rainy')\n    return 'radial-gradient(circle\
          \ at 60% 15%, rgba(186, 230, 253, 0.65) 0%, rgba(125, 211, 252, 0.35) 30%,\
          \ rgba(30, 41, 59, 0.9) 70%, #090e1a 100%)';\n  if (w === 'fog')\n    return\
          \ 'radial-gradient(ellipse at 50% 45%, rgba(148, 163, 184, 0.65) 0%, rgba(100,\
          \ 116, 139, 0.75) 45%, rgba(30, 41, 59, 0.95) 80%, #0c1322 100%)';\n  if\
          \ (w === 'cloudy')\n    return 'radial-gradient(circle at 75% 18%, rgba(148,\
          \ 163, 184, 0.75) 0%, rgba(71, 85, 105, 0.85) 35%, rgba(30, 41, 59, 0.95)\
          \ 70%, #0c1322 100%)';\n  return 'radial-gradient(circle at 82% 22%, rgba(251,\
          \ 191, 36, 0.35) 0%, rgba(56, 189, 248, 0.18) 45%, #070b14 90%)';\n]]]"
      custom_fields:
        horizon_view:
        - position: absolute
        - top: 0px
        - left: 0px
        - width: 800px
        - height: 480px
    extra_styles: "html, body, hui-view, hui-panel-view, #view, ha-app-layout, ha-panel-view,\
      \ hui-root {\n  overflow: hidden !important;\n  overscroll-behavior: none !important;\n\
      \  margin: 0 !important;\n  padding: 0 !important;\n  background: #070b14 !important;\n\
      }\n\n@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');\n\
      \n* {\n  box-sizing: border-box;\n  user-select: none;\n}\n\n/* STAGE METEO\
      \ ANIMATO A TUTTO SCHERMO */\n.weather-stage {\n  position: absolute;\n  top:\
      \ 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  z-index: 1;\n  pointer-events:\
      \ none;\n  overflow: hidden;\n}\n\n/* Bagliore Solare */\n.sun-orb {\n  position:\
      \ absolute;\n  top: -40px;\n  right: -40px;\n  width: 260px;\n  height: 260px;\n\
      \  border-radius: 50%;\n  background: radial-gradient(circle, rgba(253, 224,\
      \ 71, 0.9) 0%, rgba(251, 146, 60, 0.45) 45%, rgba(251, 146, 60, 0) 72%);\n \
      \ filter: blur(8px);\n  animation: sunPulse 5s ease-in-out infinite alternate;\n\
      \  transition: opacity 0.6s ease;\n}\n\n@keyframes sunPulse {\n  0% { transform:\
      \ scale(0.92); }\n  100% { transform: scale(1.08); }\n}\n\n\n/* Alone Solare\
      \ Diffuso per Cielo Nuvoloso */\n.cloud-orb {\n  position: absolute;\n  top:\
      \ -40px;\n  right: -40px;\n  width: 280px;\n  height: 280px;\n  border-radius:\
      \ 50%;\n  background: radial-gradient(circle, rgba(241, 245, 249, 0.42) 0%,\
      \ rgba(203, 213, 225, 0.2) 50%, rgba(203, 213, 225, 0) 75%);\n  filter: blur(14px);\n\
      \  animation: sunPulse 6s ease-in-out infinite alternate;\n  pointer-events:\
      \ none;\n}\n\n/* Nuvole Vettoriali Fluttuanti */\n.cloud-layer {\n  position:\
      \ absolute;\n  fill: rgba(255, 255, 255, 0.14);\n  filter: blur(1px);\n  transition:\
      \ opacity 0.6s ease, fill 0.6s ease;\n}\n.cloud-1 {\n  width: 420px;\n  top:\
      \ 30px;\n  right: -60px;\n  animation: driftSlow 16s ease-in-out infinite alternate;\n\
      }\n.cloud-2 {\n  width: 340px;\n  top: 120px;\n  left: -50px;\n  opacity: 0.7;\n\
      \  animation: driftSlow 22s ease-in-out infinite alternate-reverse;\n}\n\n@keyframes\
      \ driftSlow {\n  0% { transform: translate3d(-25px, 0, 0); }\n  100% { transform:\
      \ translate3d(35px, -8px, 0); }\n}\n\n/* Pioggia Animata */\n.raindrop {\n \
      \ position: absolute;\n  top: -60px;\n  width: 2px;\n  height: 45px;\n  background:\
      \ linear-gradient(to bottom, rgba(56, 189, 248, 0), rgba(125, 211, 252, 0.65));\n\
      \  transform: rotate(15deg);\n  animation: fall linear infinite;\n}\n@keyframes\
      \ fall {\n  0% { transform: translate3d(40px, -60px, 0) rotate(15deg); opacity:\
      \ 0; }\n  20% { opacity: 1; }\n  90% { opacity: 0.8; }\n  100% { transform:\
      \ translate3d(-90px, 540px, 0) rotate(15deg); opacity: 0; }\n}\n\n/* Lampo Temporale\
      \ */\n.lightning-flash {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width:\
      \ 100%;\n  height: 100%;\n  background: rgba(224, 242, 254, 0.25);\n  animation:\
      \ flashAnim 7s infinite;\n  pointer-events: none;\n}\n@keyframes flashAnim {\n\
      \  0%, 92%, 96%, 100% { opacity: 0; }\n  93% { opacity: 0.6; }\n  95% { opacity:\
      \ 0.2; }\n}\n\n/* Stelle Sereno Notte */\n.star {\n  position: absolute;\n \
      \ background: #ffffff;\n  border-radius: 50%;\n  box-shadow: 0 0 8px #ffffff;\n\
      \  animation: twinkle 3s infinite ease-in-out alternate;\n}\n@keyframes twinkle\
      \ {\n  0% { opacity: 0.2; transform: scale(0.8); }\n  100% { opacity: 0.95;\
      \ transform: scale(1.2); }\n}\n\n/* PROPOSTA 1: LAYOUT CANVAS */\n.layout-p1\
      \ {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height:\
      \ 100%;\n  z-index: 5;\n  padding: 28px 34px;\n  display: flex;\n  flex-direction:\
      \ column;\n  justify-content: space-between;\n  font-family: 'Outfit', sans-serif;\n\
      }\n\n/* Top bar */\n.p1-top {\n  display: flex;\n  justify-content: space-between;\n\
      \  align-items: center;\n}\n.p1-date-pill {\n  background: rgba(255, 255, 255,\
      \ 0.08);\n  backdrop-filter: blur(12px);\n  border: 1px solid rgba(255, 255,\
      \ 255, 0.14);\n  padding: 8px 18px;\n  border-radius: 50px;\n  font-size: 16px;\n\
      \  font-weight: 700;\n  letter-spacing: 1.5px;\n  color: #e2e8f0;\n  text-transform:\
      \ uppercase;\n}\n.p1-weather-badge {\n  display: flex;\n  align-items: center;\n\
      \  gap: 10px;\n  background: rgba(15, 23, 42, 0.45);\n  backdrop-filter: blur(12px);\n\
      \  padding: 8px 18px;\n  border-radius: 50px;\n  border: 1px solid rgba(255,\
      \ 255, 255, 0.1);\n  font-size: 18px;\n  font-weight: 600;\n  color: #f8fafc;\n\
      }\n\n/* Centro: Orologio Gigante */\n.p1-center-clock {\n  text-align: center;\n\
      \  margin: -10px 0;\n  position: relative;\n}\n.p1-time {\n  font-size: 168px;\n\
      \  font-weight: 800;\n  line-height: 0.9;\n  letter-spacing: -6px;\n  color:\
      \ #ffffff;\n  text-shadow: 0 6px 24px rgba(0, 0, 0, 0.9), 0 2px 6px rgba(0,\
      \ 0, 0, 0.95);\n  display: inline-flex;\n  align-items: baseline;\n}\n.p1-colon\
      \ {\n  color: #38bdf8;\n  margin: 0 4px;\n  animation: softBlink 2s infinite\
      \ ease-in-out;\n  text-shadow: 0 6px 20px rgba(0, 0, 0, 0.9);\n}\n.p1-minutes\
      \ {\n  color: #ffffff;\n  text-shadow: 0 6px 24px rgba(0, 0, 0, 0.9), 0 2px\
      \ 6px rgba(0, 0, 0, 0.95);\n}\n\n@keyframes softBlink {\n  0%, 100% { opacity:\
      \ 1; }\n  50% { opacity: 0.3; }\n}\n\n/* Basso: Dock Satinata */\n.p1-bottom-dock\
      \ {\n  height: 108px;\n  background: rgba(15, 23, 42, 0.62);\n  backdrop-filter:\
      \ blur(20px);\n  border: 1px solid rgba(255, 255, 255, 0.14);\n  border-radius:\
      \ 30px;\n  padding: 12px 14px 12px 28px;\n  display: flex;\n  align-items: center;\n\
      \  justify-content: space-between;\n  box-shadow: 0 16px 40px rgba(0, 0, 0,\
      \ 0.45);\n}\n\n.p1-temp-group {\n  display: flex;\n  align-items: center;\n\
      \  gap: 22px;\n}\n.p1-temp-main {\n  display: flex;\n  align-items: baseline;\n\
      }\n.p1-temp-val {\n  font-size: 64px;\n  font-weight: 800;\n  line-height: 1;\n\
      \  letter-spacing: -2px;\n  background: linear-gradient(90deg, #ffffff, #fed7aa);\n\
      \  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n\
      }\n.p1-temp-unit {\n  font-size: 28px;\n  font-weight: 700;\n  color: #fb923c;\n\
      \  margin-left: 2px;\n}\n.p1-temp-meta {\n  display: flex;\n  flex-direction:\
      \ column;\n  gap: 4px;\n  border-left: 2px solid rgba(255, 255, 255, 0.12);\n\
      \  padding-left: 18px;\n}\n.p1-temp-label {\n  font-size: 13px;\n  font-weight:\
      \ 700;\n  text-transform: uppercase;\n  letter-spacing: 1px;\n  color: #94a3b8;\n\
      }\n.p1-minmax {\n  font-size: 18px;\n  font-weight: 700;\n  display: flex;\n\
      \  gap: 12px;\n}\n\n/* Bottone Sveglia Interattivo */\n.alarm-pill-btn {\n \
      \ height: 82px;\n  min-width: 265px;\n  border-radius: 22px;\n  padding: 0 24px;\n\
      \  display: flex;\n  align-items: center;\n  justify-content: space-between;\n\
      \  cursor: pointer;\n  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);\n\
      \  background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);\n  box-shadow:\
      \ 0 8px 25px rgba(245, 158, 11, 0.4);\n  border: 1px solid rgba(255, 255, 255,\
      \ 0.3);\n}\n.alarm-pill-btn:active {\n  transform: scale(0.94);\n  transition:\
      \ transform 0.08s ease;\n}\n.alarm-pill-btn.off {\n  background: rgba(30, 41,\
      \ 59, 0.85);\n  box-shadow: none;\n  border: 1px solid rgba(255, 255, 255, 0.08);\n\
      \  color: #94a3b8;\n}\n.alarm-text-col {\n  display: flex;\n  flex-direction:\
      \ column;\n  text-align: left;\n}\n.alarm-title {\n  font-size: 13px;\n  font-weight:\
      \ 700;\n  text-transform: uppercase;\n  letter-spacing: 1.2px;\n  opacity: 0.9;\n\
      \  color: #ffffff;\n}\n.alarm-time-val {\n  font-size: 32px;\n  font-weight:\
      \ 800;\n  line-height: 1.1;\n  color: #ffffff;\n}\n.alarm-status-dot {\n  width:\
      \ 42px;\n  height: 42px;\n  border-radius: 50%;\n  background: rgba(255, 255,\
      \ 255, 0.22);\n  display: flex;\n  align-items: center;\n  justify-content:\
      \ center;\n  font-size: 20px;\n}\n\n\n/* Fiocchi di Neve */\n.snowflake {\n\
      \  position: absolute;\n  top: -10px;\n  background: #ffffff;\n  border-radius:\
      \ 50%;\n  box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);\n  animation: fallSnow\
      \ linear infinite;\n  pointer-events: none;\n}\n@keyframes fallSnow {\n  0%\
      \ { transform: translate3d(0, -10px, 0); opacity: 0; }\n  15% { opacity: 0.9;\
      \ }\n  90% { opacity: 0.85; }\n  100% { transform: translate3d(25px, 500px,\
      \ 0); opacity: 0; }\n}\n\n/* Banchi di Nebbia */\n.fog-layer {\n  position:\
      \ absolute;\n  top: 0;\n  left: -30%;\n  width: 160%;\n  height: 100%;\n  pointer-events:\
      \ none;\n}\n.fog-1 {\n  background: radial-gradient(ellipse at 50% 55%, rgba(226,\
      \ 232, 240, 0.22) 0%, rgba(148, 163, 184, 0.1) 50%, transparent 75%);\n  filter:\
      \ blur(16px);\n  animation: fogDrift 22s ease-in-out infinite alternate;\n}\n\
      .fog-2 {\n  background: radial-gradient(ellipse at 45% 65%, rgba(203, 213, 225,\
      \ 0.16) 0%, rgba(100, 116, 139, 0.08) 55%, transparent 80%);\n  filter: blur(20px);\n\
      \  animation: fogDrift 30s ease-in-out infinite alternate-reverse;\n}\n@keyframes\
      \ fogDrift {\n  0% { transform: translate3d(-35px, 0, 0); opacity: 0.6; }\n\
      \  50% { opacity: 0.95; }\n  100% { transform: translate3d(35px, -12px, 0);\
      \ opacity: 0.65; }\n}\n"
    custom_fields:
      horizon_view: "[[[\n  const now = new Date();\n  const giorni = ['DOMENICA','LUNEDÌ','MARTEDÌ','MERCOLEDÌ','GIOVEDÌ','VENERDÌ','SABATO'];\n\
        \  const mesi = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];\n\
        \  const dateStr = `${giorni[now.getDay()]} ${now.getDate()} ${mesi[now.getMonth()]}`;\n\
        \  \n  const hh = String(now.getHours()).padStart(2, '0');\n  const mm = String(now.getMinutes()).padStart(2,\
        \ '0');\n\n  const sTemp = states['sensor.temperatura_esterna'];\n  const\
        \ tempVal = (sTemp && sTemp.state) ? sTemp.state : (entity.attributes.temperature\
        \ || 0);\n  const temp = parseFloat(tempVal).toFixed(1);\n\n  const sMinMax\
        \ = states['sensor.meteo_comodino_minmax'];\n  const minMaxAttrs = (sMinMax\
        \ && sMinMax.attributes) ? sMinMax.attributes : {};\n  const tMin = (minMaxAttrs.temp_min\
        \ !== undefined && minMaxAttrs.temp_min !== null) ? minMaxAttrs.temp_min :\
        \ '--';\n  const tMax = (minMaxAttrs.temp_max !== undefined && minMaxAttrs.temp_max\
        \ !== null) ? minMaxAttrs.temp_max : '--';\n\n  const wState = entity.state;\n\
        \  const windSpeed = entity.attributes.wind_speed ? ` • Vento ${entity.attributes.wind_speed}\
        \ km/h` : '';\n  \n  const isSunny = wState === 'sunny' || wState === 'partlycloudy';\n\
        \  const isRainy = wState === 'rainy' || wState === 'pouring';\n  const isStorm\
        \ = wState === 'lightning' || wState === 'lightning-rainy';\n  const isNight\
        \ = wState === 'clear-night';\n  const isCloudy = wState === 'cloudy';\n \
        \ const isFog = wState === 'fog';\n  const isSnowy = wState === 'snowy' ||\
        \ wState === 'snowy-rainy';\n  \n  const mapMeteo = {\n    'sunny': ['Soleggiato',\
        \ '☀️'],\n    'clear-night': ['Cielo Sereno', '\U0001F319'],\n    'partlycloudy':\
        \ ['Poco Nuvoloso', '⛅'],\n    'cloudy': ['Nuvoloso', '☁️'],\n    'fog': ['Nebbia',\
        \ '\U0001F32B️'],\n    'snowy': ['Neve', '❄️'],\n    'snowy-rainy': ['Nevischio',\
        \ '\U0001F328️'],\n    'lightning': ['Temporale', '⛈️'],\n    'rainy': ['Pioggia',\
        \ '\U0001F327️'],\n    'pouring': ['Pioggia Forte', '⛈️'],\n    'lightning-rainy':\
        \ ['Temporale', '⛈️'],\n    'windy': ['Ventoso', '\U0001F4A8'],\n    'windy-variant':\
        \ ['Ventoso', '\U0001F4A8']\n  };\n  const [desc, icon] = mapMeteo[wState]\
        \ || ['Variabile', '⛅'];\n\n  const sAlarm = states['input_boolean.sveglia_comodino_attiva'];\n\
        \  const alarmOn = (sAlarm && sAlarm.state === 'on');\n  const sAlarmTime\
        \ = states['input_datetime.sveglia_comodino_orario'];\n  const alarmRaw =\
        \ (sAlarmTime && sAlarmTime.state) ? sAlarmTime.state : '07:30:00';\n  const\
        \ alarmTime = alarmRaw.substring(0, 5);\n\n  let rainHtml = '';\n  if (isRainy\
        \ || isStorm) {\n    for (let i = 0; i < 20; i++) {\n      const left = Math.floor(Math.random()\
        \ * 105);\n      const dur = (0.6 + Math.random() * 0.4).toFixed(2);\n   \
        \   const del = (Math.random() * 1.5).toFixed(2);\n      rainHtml += `<div\
        \ class=\"raindrop\" style=\"left:${left}%; animation-duration:${dur}s; animation-delay:${del}s;\"\
        ></div>`;\n    }\n  }\n\n  let starsHtml = '';\n  if (isNight) {\n    for\
        \ (let i = 0; i < 24; i++) {\n      const left = Math.floor(Math.random()\
        \ * 100);\n      const top = Math.floor(Math.random() * 65);\n      const\
        \ size = (2 + Math.random() * 2).toFixed(1);\n      const del = (Math.random()\
        \ * 3).toFixed(1);\n      starsHtml += `<div class=\"star\" style=\"width:${size}px;\
        \ height:${size}px; left:${left}%; top:${top}%; animation-delay:${del}s;\"\
        ></div>`;\n    }\n  }\n\n  \n  let snowHtml = '';\n  if (isSnowy) {\n    for\
        \ (let i = 0; i < 24; i++) {\n      const left = Math.floor(Math.random()\
        \ * 102);\n      const dur = (3.0 + Math.random() * 3.0).toFixed(2);\n   \
        \   const del = (Math.random() * 3.5).toFixed(2);\n      const size = (3 +\
        \ Math.random() * 3.5).toFixed(1);\n      const op = (0.55 + Math.random()\
        \ * 0.4).toFixed(2);\n      snowHtml += `<div class=\"snowflake\" style=\"\
        width:${size}px; height:${size}px; left:${left}%; animation-duration:${dur}s;\
        \ animation-delay:${del}s; opacity:${op};\"></div>`;\n    }\n  }\n\n  let\
        \ fogHtml = '';\n  if (isFog) {\n    fogHtml = '<div class=\"fog-layer fog-1\"\
        ></div><div class=\"fog-layer fog-2\"></div>';\n  }\n\n  return `\n    <div\
        \ class=\"weather-stage\">\n      ${isSunny ? '<div class=\"sun-orb\"></div>'\
        \ : ''}\n      ${isCloudy ? '<div class=\"cloud-orb\"></div>' : ''}\n    \
        \  ${isStorm ? '<div class=\"lightning-flash\"></div>' : ''}\n      ${starsHtml}\n\
        \      ${fogHtml}\n      <svg class=\"cloud-layer cloud-1\" viewBox=\"0 0\
        \ 200 100\">\n        <path d=\"M 35 80 Q 15 80 15 62 Q 15 46 32 44 Q 40 20\
        \ 68 20 Q 98 20 108 42 Q 125 35 142 45 Q 162 46 162 64 Q 162 80 140 80 Z\"\
        \ />\n      </svg>\n      <svg class=\"cloud-layer cloud-2\" viewBox=\"0 0\
        \ 200 100\">\n        <path d=\"M 35 80 Q 15 80 15 62 Q 15 46 32 44 Q 40 20\
        \ 68 20 Q 98 20 108 42 Q 125 35 142 45 Q 162 46 162 64 Q 162 80 140 80 Z\"\
        \ />\n      </svg>\n      ${rainHtml}\n      ${snowHtml}\n    </div>\n\n \
        \   <div class=\"layout-p1\">\n      <div class=\"p1-top\">\n        <div\
        \ class=\"p1-date-pill\">\U0001F4C5 ${dateStr}</div>\n        <div class=\"\
        p1-weather-badge\">\n          <span>${icon}</span>\n          <span>${desc}${windSpeed}</span>\n\
        \        </div>\n      </div>\n\n      <div class=\"p1-center-clock\">\n \
        \       <div class=\"p1-time\">\n          <span>${hh}</span><span class=\"\
        p1-colon\">:</span><span class=\"p1-minutes\">${mm}</span>\n        </div>\n\
        \      </div>\n\n      <div class=\"p1-bottom-dock\">\n        <div class=\"\
        p1-temp-group\">\n          <div class=\"p1-temp-main\">\n            <span\
        \ class=\"p1-temp-val\">${isNaN(temp) ? '--' : temp}</span>\n            <span\
        \ class=\"p1-temp-unit\">°C</span>\n          </div>\n          <div class=\"\
        p1-temp-meta\">\n            <span class=\"p1-temp-label\">\U0001F321️ Temp.\
        \ Esterna</span>\n            <div class=\"p1-minmax\">\n              <span\
        \ style=\"color:#38bdf8;\">↓ ${tMin}°</span>\n              <span style=\"\
        color:#fb923c;\">↑ ${tMax}°</span>\n            </div>\n          </div>\n\
        \        </div>\n\n        <div class=\"alarm-pill-btn ${alarmOn ? '' : 'off'}\"\
        >\n          <div class=\"alarm-text-col\">\n            <span class=\"alarm-title\"\
        >${alarmOn ? 'SVEGLIA ATTIVA' : 'SVEGLIA SPENTA'}</span>\n            <span\
        \ class=\"alarm-time-val\">${alarmTime}</span>\n          </div>\n       \
        \   <div class=\"alarm-status-dot\">${alarmOn ? '\U0001F514' : '\U0001F515\
        '}</div>\n        </div>\n      </div>\n    </div>\n  `;\n]]]\n"
- title: Imposta Orario Sveglia
  path: orario
  type: custom:grid-layout
  layout:
    grid-template-columns: 118px 24px 118px 200px
    grid-template-rows: 32px 38px 90px 38px 54px
    grid-gap: 8px
    padding: 12px 14px
    height: 320px
    width: 533px
    overflow: hidden
  cards:
  - type: custom:button-card
    name: ⏰ REGOLA ORARIO SVEGLIA
    view_layout:
      grid-column: 1 / 4
      grid-row: 1 / 2
    styles:
      card:
      - background: rgba(255, 255, 255, 0.08)
      - backdrop-filter: blur(12px)
      - border: 1px solid rgba(255, 255, 255, 0.14)
      - border-radius: 50px
      - height: 100%
      - font-size: 12px
      - font-weight: '800'
      - letter-spacing: 1px
      - color: '#fed7aa'
      - justify-self: start
      - padding: 0 14px
  - type: custom:button-card
    name: ✕ ANNULLA
    view_layout:
      grid-column: 4 / 5
