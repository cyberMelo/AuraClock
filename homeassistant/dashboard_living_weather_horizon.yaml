kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
  - title: Comodino
    path: 0
    panel: true
    background: "#070b14"
    cards:
      - type: "custom:button-card"
        entity: weather.casa
        triggers_update:
          - sun.sun
          - sensor.time_2
          - sensor.casa_rotondo_salotto_esterno_temperature
          - sensor.meteo_comodino_minmax
          - input_boolean.sveglia_comodino_attiva
          - input_datetime.sveglia_comodino_orario
        show_icon: false
        show_name: false
        tap_action:
          action: none
        hold_action:
          action: none
        styles:
          card:
            - width: 800px
            - height: 480px
            - border-radius: 0px
            - border: none
            - padding: 0
            - margin: 0
            - position: relative
            - overflow: hidden
            - zoom: 0.666667
            - background: |
                [[[
                  const w = entity.state;
                  const sun = states['sun.sun'];
                  const isSunBelow = sun ? sun.state === 'below_horizon' : false;
                  const isNight = (w === 'clear-night') || isSunBelow || (!sun && (new Date().getHours() >= 21 || new Date().getHours() < 6));
                  if (w === 'rainy' || w === 'pouring')
                    return 'radial-gradient(circle at 50% 0%, rgba(30, 64, 175, 0.45) 0%, rgba(15, 23, 42, 0.85) 60%, #050811 100%)';
                  if (w === 'lightning-rainy' || w === 'lightning')
                    return 'radial-gradient(circle at 70% 15%, rgba(124, 58, 237, 0.32) 0%, rgba(17, 24, 39, 0.9) 55%, #04060c 100%)';
                  if (isNight && (w === 'sunny' || w === 'clear' || w === 'clear-night'))
                    return 'radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.28) 0%, rgba(15, 23, 42, 0.65) 50%, #03050a 100%)';
                  if (w === 'snowy' || w === 'snowy-rainy')
                    return 'radial-gradient(circle at 60% 15%, rgba(186, 230, 253, 0.65) 0%, rgba(125, 211, 252, 0.35) 30%, rgba(30, 41, 59, 0.9) 70%, #090e1a 100%)';
                  if (w === 'fog')
                    return 'radial-gradient(ellipse at 50% 45%, rgba(148, 163, 184, 0.65) 0%, rgba(100, 116, 139, 0.75) 45%, rgba(30, 41, 59, 0.95) 80%, #0c1322 100%)';
                  if (w === 'cloudy')
                    return 'radial-gradient(circle at 75% 18%, rgba(148, 163, 184, 0.75) 0%, rgba(71, 85, 105, 0.85) 35%, rgba(30, 41, 59, 0.95) 70%, #0c1322 100%)';
                  if (w === 'partlycloudy') {
                    if (isNight) return 'radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.22) 0%, rgba(30, 41, 59, 0.7) 50%, #03050a 100%)';
                    return 'radial-gradient(circle at 80% 15%, rgba(251, 191, 36, 0.22) 0%, rgba(56, 189, 248, 0.15) 30%, rgba(15, 23, 42, 0.65) 60%, #050813 100%)';
                  }
                  if (isNight)
                    return 'radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.28) 0%, rgba(15, 23, 42, 0.65) 50%, #03050a 100%)';
                  return 'radial-gradient(circle at 82% 22%, rgba(251, 191, 36, 0.35) 0%, rgba(56, 189, 248, 0.18) 45%, #070b14 90%)';
                ]]]
          custom_fields:
            horizon_view:
              - position: absolute
              - top: 0px
              - left: 0px
              - width: 800px
              - height: 480px
            music_btn:
              - position: absolute
              - top: 25px
              - left: 335px
              - width: 130px
              - height: 36px
              - z-index: 100
            alarm_btn:
              - position: absolute
              - bottom: 25px
              - right: 40px
              - width: 265px
              - height: 80px
              - z-index: 100
        extra_styles: |
          html, body, hui-view, hui-panel-view, #view, ha-app-layout, ha-panel-view, hui-root {
            overflow: hidden !important;
            overscroll-behavior: none !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #070b14 !important;
          }
          
          @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');
          
          * {
            box-sizing: border-box;
            user-select: none;
          }
          
          /* STAGE METEO ANIMATO A TUTTO SCHERMO */
          .weather-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
          }
          
          /* Bagliore Solare Pulsante */
          .sun-orb {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 290px;
            height: 290px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(253, 224, 71, 0.95) 0%, rgba(251, 146, 60, 0.55) 45%, rgba(251, 146, 60, 0) 75%);
            filter: blur(10px);
            animation: sunPulse 3.5s ease-in-out infinite alternate;
            transition: opacity 0.6s ease;
          }
          
          @keyframes sunPulse {
            0% { transform: scale(0.88); opacity: 0.85; }
            100% { transform: scale(1.15); opacity: 1; }
          }
          
          /* Fascio Luminoso Conico Rotante */
          .sun-beam {
            position: absolute;
            top: -140px;
            right: -140px;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: conic-gradient(from 180deg at 75% 25%, transparent 0deg, rgba(254, 240, 138, 0.16) 35deg, transparent 70deg, rgba(251, 146, 60, 0.12) 110deg, transparent 150deg, rgba(254, 240, 138, 0.15) 195deg, transparent 240deg);
            animation: rotateBeam 32s linear infinite;
            filter: blur(14px);
            pointer-events: none;
          }
          @keyframes rotateBeam {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          
          /* Granelli di Pulviscolo Solare Fluttuanti */
          .sun-mote {
            position: absolute;
            background: #fef08a;
            border-radius: 50%;
            box-shadow: 0 0 6px #facc15;
            animation: floatMote linear infinite;
            pointer-events: none;
          }
          @keyframes floatMote {
            0% { transform: translate3d(0, 30px, 0); opacity: 0; }
            25% { opacity: 0.9; }
            75% { opacity: 0.75; }
            100% { transform: translate3d(40px, -160px, 0); opacity: 0; }
          }
          
          /* Alone Solare Diffuso per Cielo Nuvoloso */
          .cloud-orb {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 290px;
            height: 290px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(241, 245, 249, 0.5) 0%, rgba(203, 213, 225, 0.25) 50%, rgba(203, 213, 225, 0) 75%);
            filter: blur(14px);
            animation: sunPulse 4s ease-in-out infinite alternate;
            pointer-events: none;
          }
          
          /* Alone Lunare Notturno */
          .moon-orb {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(199, 210, 254, 0.55) 0%, rgba(129, 140, 248, 0.28) 45%, rgba(99, 102, 241, 0) 74%);
            filter: blur(10px);
            animation: moonPulse 4s ease-in-out infinite alternate;
            pointer-events: none;
          }
          
          @keyframes moonPulse {
            0% { transform: scale(0.90); opacity: 0.75; }
            100% { transform: scale(1.12); opacity: 1; }
          }
          
          /* Nuvole Vettoriali Fluttuanti Dinamiche */
          .cloud-layer {
            position: absolute;
            fill: rgba(255, 255, 255, 0.22);
            filter: blur(1px);
            transition: opacity 0.6s ease, fill 0.6s ease;
          }
          .cloud-1 {
            width: 440px;
            top: 25px;
            right: -70px;
            animation: driftOne 8.5s ease-in-out infinite alternate;
          }
          .cloud-2 {
            width: 360px;
            top: 110px;
            left: -60px;
            opacity: 0.85;
            animation: driftTwo 11s ease-in-out infinite alternate-reverse;
          }
          .cloud-3 {
            width: 240px;
            top: 15px;
            left: 220px;
            opacity: 0.5;
            animation: driftThree 7s ease-in-out infinite alternate;
          }
          
          @keyframes driftOne {
            0% { transform: translate3d(-50px, 0, 0) scale(0.96); }
            100% { transform: translate3d(60px, -14px, 0) scale(1.04); }
          }
          @keyframes driftTwo {
            0% { transform: translate3d(-40px, -8px, 0) scale(1.02); }
            100% { transform: translate3d(65px, 12px, 0) scale(0.96); }
          }
          @keyframes driftThree {
            0% { transform: translate3d(40px, 0, 0); }
            100% { transform: translate3d(-50px, -10px, 0); }
          }
          
          /* Pioggia Animata */
          .raindrop {
            position: absolute;
            top: -60px;
            width: 2px;
            height: 45px;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0), rgba(125, 211, 252, 0.65));
            transform: rotate(15deg);
            animation: fall linear infinite;
          }
          @keyframes fall {
            0% { transform: translate3d(40px, -60px, 0) rotate(15deg); opacity: 0; }
            20% { opacity: 1; }
            90% { opacity: 0.8; }
            100% { transform: translate3d(-90px, 540px, 0) rotate(15deg); opacity: 0; }
          }
          
          /* Lampo Temporale */
          .lightning-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(224, 242, 254, 0.25);
            animation: flashAnim 7s infinite;
            pointer-events: none;
          }
          @keyframes flashAnim {
            0%, 92%, 96%, 100% { opacity: 0; }
            93% { opacity: 0.6; }
            95% { opacity: 0.2; }
          }
          
          /* Stelle Sereno Notte */
          .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
            animation: twinkle 1.8s infinite ease-in-out alternate;
          }
          @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.65); }
            100% { opacity: 1; transform: scale(1.35); }
          }
          
          /* PROPOSTA 1: LAYOUT CANVAS */
          .layout-p1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            padding: 28px 34px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: 'Outfit', sans-serif;
          }
          
          /* Top bar */
          .p1-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
          }
          .p1-date-pill {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #e2e8f0;
            text-transform: uppercase;
          }
          .p1-weather-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 18px;
            font-weight: 600;
            color: #f8fafc;
          }
          
          /* Centro: Orologio Gigante */
          .p1-center-clock {
            text-align: center;
            margin: -10px 0;
            position: relative;
          }
          .p1-time {
            font-size: 168px;
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -6px;
            color: #ffffff;
            text-shadow: 0 6px 24px rgba(0, 0, 0, 0.9), 0 2px 6px rgba(0, 0, 0, 0.95);
            display: inline-flex;
            align-items: baseline;
          }
          .p1-colon {
            color: #38bdf8;
            margin: 0 4px;
            animation: softBlink 1s infinite ease-in-out;
            text-shadow: 0 6px 20px rgba(0, 0, 0, 0.9);
          }
          .p1-minutes {
            color: #ffffff;
            text-shadow: 0 6px 24px rgba(0, 0, 0, 0.9), 0 2px 6px rgba(0, 0, 0, 0.95);
          }
          
          @keyframes softBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(0.92); }
          }
          
          /* Basso: Dock Satinata */
          .p1-bottom-dock {
            height: 108px;
            background: rgba(15, 23, 42, 0.62);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 30px;
            padding: 12px 14px 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
          }
          
          .p1-temp-group {
            display: flex;
            align-items: center;
            gap: 22px;
          }
          .p1-temp-main {
            display: flex;
            align-items: baseline;
            margin-right: 22px;
          }
          .p1-temp-val {
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #ffffff, #fed7aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
          }
          .p1-temp-unit {
            font-size: 28px;
            font-weight: 700;
            color: #fb923c;
            margin-left: 2px;
          }
          .p1-temp-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-left: 2px solid rgba(255, 255, 255, 0.12);
            padding-left: 18px;
          }
          .p1-temp-label {
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
          }
          .p1-minmax {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            gap: 12px;
          }
          
          /* Bottone Sveglia Interattivo */
          .alarm-pill-btn {
            height: 82px;
            min-width: 265px;
            border-radius: 22px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
          }
          .alarm-pill-btn:active {
            transform: scale(0.94);
            transition: transform 0.08s ease;
          }
          .alarm-pill-btn.off {
            background: rgba(30, 41, 59, 0.85);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
          }
          .alarm-text-col {
            display: flex;
            flex-direction: column;
            text-align: left;
          }
          .alarm-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            opacity: 0.9;
            color: #ffffff;
          }
          .alarm-time-val {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
            color: #ffffff;
          }
          .alarm-status-dot {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
          }
          
          
          /* Fiocchi di Neve */
          .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
            animation: fallSnow linear infinite;
            pointer-events: none;
          }
          @keyframes fallSnow {
            0% { transform: translate3d(0, -10px, 0); opacity: 0; }
            15% { opacity: 0.9; }
            90% { opacity: 0.85; }
            100% { transform: translate3d(25px, 500px, 0); opacity: 0; }
          }
          
          /* Banchi di Nebbia */
          .fog-layer {
            position: absolute;
            top: 0;
            left: -30%;
            width: 160%;
            height: 100%;
            pointer-events: none;
          }
          .fog-1 {
            background: radial-gradient(ellipse at 50% 55%, rgba(226, 232, 240, 0.22) 0%, rgba(148, 163, 184, 0.1) 50%, transparent 75%);
            filter: blur(16px);
            animation: fogDrift 22s ease-in-out infinite alternate;
          }
          .fog-2 {
            background: radial-gradient(ellipse at 45% 65%, rgba(203, 213, 225, 0.16) 0%, rgba(100, 116, 139, 0.08) 55%, transparent 80%);
            filter: blur(20px);
            animation: fogDrift 30s ease-in-out infinite alternate-reverse;
          }
          @keyframes fogDrift {
            0% { transform: translate3d(-35px, 0, 0); opacity: 0.6; }
            50% { opacity: 0.95; }
            100% { transform: translate3d(35px, -12px, 0); opacity: 0.65; }
          }
        custom_fields:
          horizon_view: |
            [[[
              // --- AuraClock Native Horizontal Swipe Navigation ---
              if (!window.__auraSwipeAttached) {
                window.__auraSwipeAttached = true;
                var sX = 0, sY = 0, sT = 0;
                window.addEventListener('touchstart', function(e) {
                  if (e.touches && e.touches.length === 1) {
                    sX = e.touches[0].clientX;
                    sY = e.touches[0].clientY;
                    sT = Date.now();
                  }
                }, { capture: true, passive: true });
                
                window.addEventListener('touchend', function(e) {
                  if (e.changedTouches && e.changedTouches.length === 1) {
                    var dX = e.changedTouches[0].clientX - sX;
                    var dY = e.changedTouches[0].clientY - sY;
                    var dt = Date.now() - sT;
                    if (sT && Math.abs(dX) >= 60 && Math.abs(dY) <= 80 && dt < 800) {
                      sT = 0;
                      var nowTs = Date.now();
                      if (window.__auraLastNavTs && (nowTs - window.__auraLastNavTs) < 400) return;
                      var p = window.location.pathname;
                      var nav = function(dst) {
                        window.__auraLastNavTs = nowTs;
                        if (window.history && window.history.pushState) {
                          window.history.pushState(null, '', dst);
                        }
                        window.dispatchEvent(new CustomEvent('location-changed', { detail: { replace: false } }));
                      };
                      if (dX < -60) {
                        if (!p.includes('/musica') && !p.includes('/orario') && !p.includes('/radio') && !p.includes('/playlist')) {
                          nav('/lovelace-comodino/musica');
                        }
                      } else if (dX > 60) {
                        if (p.includes('/radio') || p.includes('/playlist')) {
                          nav('/lovelace-comodino/musica');
                        } else if (p.includes('/musica')) {
                          nav('/lovelace-comodino/0');
                        }
                      }
                    }
                  }
                }, { capture: true, passive: true });
              }
            
            
            
            
              window.hass = hass;
              const now = new Date();
              const giorni = ['DOMENICA','LUNEDÌ','MARTEDÌ','MERCOLEDÌ','GIOVEDÌ','VENERDÌ','SABATO'];
              const mesi = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
              const dateStr = `${giorni[now.getDay()]} ${now.getDate()} ${mesi[now.getMonth()]}`;
              
              const hh = String(now.getHours()).padStart(2, '0');
              const mm = String(now.getMinutes()).padStart(2, '0');
            
              const sTemp = states['sensor.casa_rotondo_salotto_esterno_temperature'];
              const tempVal = (sTemp && sTemp.state !== undefined && sTemp.state !== 'unavailable' && sTemp.state !== 'unknown') ? sTemp.state : (entity.attributes.temperature || 0);
              const temp = parseFloat(tempVal).toFixed(1);
            
              const sMinMax = states['sensor.meteo_comodino_minmax'];
              const minMaxAttrs = (sMinMax && sMinMax.attributes) ? sMinMax.attributes : {};
              const tMin = (minMaxAttrs.temp_min !== undefined && minMaxAttrs.temp_min !== null) ? minMaxAttrs.temp_min : '--';
              const tMax = (minMaxAttrs.temp_max !== undefined && minMaxAttrs.temp_max !== null) ? minMaxAttrs.temp_max : '--';
            
              const wState = entity.state;
              const windSpeed = entity.attributes.wind_speed ? ` • Vento ${entity.attributes.wind_speed} km/h` : '';
              
              const sSun = states['sun.sun'];
              const isSunBelow = sSun ? sSun.state === 'below_horizon' : false;
              const isNight = (wState === 'clear-night') || isSunBelow || (!sSun && (now.getHours() >= 21 || now.getHours() < 6));
              
              const isRainy = wState === 'rainy' || wState === 'pouring';
              const isStorm = wState === 'lightning' || wState === 'lightning-rainy';
              const isCloudy = wState === 'cloudy';
              const isFog = wState === 'fog';
              const isSnowy = wState === 'snowy' || wState === 'snowy-rainy';
              const isPartlyCloudy = wState === 'partlycloudy';
              
              const isSunny = !isNight && (wState === 'sunny' || isPartlyCloudy);
              const showMoon = isNight && !isRainy && !isStorm && !isFog;
              const showStars = isNight && !isRainy && !isStorm && !isFog;
              
              const mapMeteo = {
                'sunny': isNight ? ['Cielo Sereno', '🌙'] : ['Soleggiato', '☀️'],
                'clear-night': ['Cielo Sereno', '🌙'],
                'partlycloudy': isNight ? ['Poco Nuvoloso', '🌙'] : ['Poco Nuvoloso', '⛅'],
                'cloudy': ['Nuvoloso', '☁️'],
                'fog': ['Nebbia', '🌫️'],
                'snowy': ['Neve', '❄️'],
                'snowy-rainy': ['Nevischio', '🌨️'],
                'lightning': ['Temporale', '⛈️'],
                'rainy': ['Pioggia', '🌧️'],
                'pouring': ['Pioggia Forte', '⛈️'],
                'lightning-rainy': ['Temporale', '⛈️'],
                'windy': ['Ventoso', '💨'],
                'windy-variant': ['Ventoso', '💨']
              };
              const [desc, icon] = mapMeteo[wState] || (isNight ? ['Sereno Notte', '🌙'] : ['Variabile', '⛅']);
            
              const sAlarm = states['input_boolean.sveglia_comodino_attiva'];
              const alarmOn = (sAlarm && sAlarm.state === 'on');
              const sAlarmTime = states['input_datetime.sveglia_comodino_orario'];
              const alarmRaw = (sAlarmTime && sAlarmTime.state) ? sAlarmTime.state : '07:30:00';
              const alarmTime = alarmRaw.substring(0, 5);
            
              let rainHtml = '';
              if (isRainy || isStorm) {
                for (let i = 0; i < 20; i++) {
                  const left = Math.floor(Math.random() * 105);
                  const dur = (0.6 + Math.random() * 0.4).toFixed(2);
                  const del = (Math.random() * 1.5).toFixed(2);
                  rainHtml += `<div class="raindrop" style="left:${left}%; animation-duration:${dur}s; animation-delay:${del}s;"></div>`;
                }
              }
            
              let starsHtml = '';
              if (showStars) {
                for (let i = 0; i < 24; i++) {
                  const left = Math.floor(Math.random() * 100);
                  const top = Math.floor(Math.random() * 65);
                  const size = (2 + Math.random() * 2).toFixed(1);
                  const del = (Math.random() * 3).toFixed(1);
                  starsHtml += `<div class="star" style="width:${size}px; height:${size}px; left:${left}%; top:${top}%; animation-delay:${del}s;"></div>`;
                }
              }
            
              
              let snowHtml = '';
              if (isSnowy) {
                for (let i = 0; i < 24; i++) {
                  const left = Math.floor(Math.random() * 102);
                  const dur = (3.0 + Math.random() * 3.0).toFixed(2);
                  const del = (Math.random() * 3.5).toFixed(2);
                  const size = (3 + Math.random() * 3.5).toFixed(1);
                  const op = (0.55 + Math.random() * 0.4).toFixed(2);
                  snowHtml += `<div class="snowflake" style="width:${size}px; height:${size}px; left:${left}%; animation-duration:${dur}s; animation-delay:${del}s; opacity:${op};"></div>`;
                }
              }
            
              let fogHtml = '';
              if (isFog) {
                fogHtml = '<div class="fog-layer fog-1"></div><div class="fog-layer fog-2"></div>';
              }
            
              let motesHtml = '';
              if (isSunny) {
                for (let i = 0; i < 8; i++) {
                  const left = Math.floor(62 + Math.random() * 34);
                  const top = Math.floor(8 + Math.random() * 45);
                  const size = (2.5 + Math.random() * 3.5).toFixed(1);
                  const dur = (3.0 + Math.random() * 2.5).toFixed(1);
                  const del = (Math.random() * 2.5).toFixed(1);
                  motesHtml += `<div class="sun-mote" style="width:${size}px; height:${size}px; left:${left}%; top:${top}%; animation-duration:${dur}s; animation-delay:${del}s;"></div>`;
                }
              }
            
              return `
                <div class="weather-stage">
                  ${isSunny ? '<div class="sun-orb"></div><div class="sun-beam"></div>' + motesHtml : ''}
                  ${showMoon ? '<div class="moon-orb"></div>' : ''}
                  ${isCloudy ? '<div class="cloud-orb"></div>' : ''}
                  ${isStorm ? '<div class="lightning-flash"></div>' : ''}
                  ${starsHtml}
                  ${fogHtml}
                  <svg class="cloud-layer cloud-1" viewBox="0 0 200 100">
                    <path d="M 35 80 Q 15 80 15 62 Q 15 46 32 44 Q 40 20 68 20 Q 98 20 108 42 Q 125 35 142 45 Q 162 46 162 64 Q 162 80 140 80 Z" />
                  </svg>
                  <svg class="cloud-layer cloud-2" viewBox="0 0 200 100">
                    <path d="M 35 80 Q 15 80 15 62 Q 15 46 32 44 Q 40 20 68 20 Q 98 20 108 42 Q 125 35 142 45 Q 162 46 162 64 Q 162 80 140 80 Z" />
                  </svg>
                  <svg class="cloud-layer cloud-3" viewBox="0 0 200 100">
                    <path d="M 35 80 Q 15 80 15 62 Q 15 46 32 44 Q 40 20 68 20 Q 98 20 108 42 Q 125 35 142 45 Q 162 46 162 64 Q 162 80 140 80 Z" />
                  </svg>
                  ${rainHtml}
                  ${snowHtml}
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'/>" style="display:none;" onload="(function(img){
              if (window._auraClockTimer) clearInterval(window._auraClockTimer);
              window._auraClockTimer = setInterval(function(){
                var now = new Date();
                var h = String(now.getHours()).padStart(2, '0');
                var m = String(now.getMinutes()).padStart(2, '0');
                var root = img.getRootNode ? img.getRootNode() : document;
                var elH = root.querySelectorAll('.p1-hours');
                var elM = root.querySelectorAll('.p1-minutes');
                elH.forEach(function(el){ if (el.textContent !== h) el.textContent = h; });
                elM.forEach(function(el){ if (el.textContent !== m) el.textContent = m; });
              }, 1000);
            })(this)"/>
                </div>
            
                <div class="layout-p1">
                  <div class="p1-top">
                    <div class="p1-date-pill">📅 ${dateStr}</div>
                    <div style="width:130px; height:36px;"></div>
                    <div class="p1-weather-badge">
                      <span style="margin-right:8px;">${icon}</span>
                      <span>${desc}${windSpeed}</span>
                    </div>
                  </div>
            
                  <div class="p1-center-clock">
                    <div class="p1-time">
                      <span class="p1-hours">${hh}</span><span class="p1-colon">:</span><span class="p1-minutes">${mm}</span>
                    </div>
                  </div>
            
                  <div class="p1-bottom-dock">
                    <div class="p1-temp-group">
                      <div class="p1-temp-main">
                        <span class="p1-temp-val">${isNaN(temp) ? '--' : temp}</span>
                        <span class="p1-temp-unit">°C</span>
                      </div>
                      <div class="p1-temp-meta">
