                  <button onclick="hass.callService('input_datetime','set_datetime',{entity_id:'input_datetime.sveglia_comodino_orario',time:'06:45:00'})" style="background:rgba(30,41,59,0.7); border:1px solid rgba(255,255,255,0.12); color:#cbd5e1; border-radius:14px; font-size:13px; font-weight:800; cursor:pointer;">06:45</button>
                  <button onclick="hass.callService('input_datetime','set_datetime',{entity_id:'input_datetime.sveglia_comodino_orario',time:'07:00:00'})" style="background:rgba(30,41,59,0.7); border:1px solid rgba(255,255,255,0.12); color:#cbd5e1; border-radius:14px; font-size:13px; font-weight:800; cursor:pointer;">07:00</button>
                  <button onclick="hass.callService('input_datetime','set_datetime',{entity_id:'input_datetime.sveglia_comodino_orario',time:'07:30:00'})" style="background:rgba(30,41,59,0.7); border:1px solid rgba(255,255,255,0.12); color:#cbd5e1; border-radius:14px; font-size:13px; font-weight:800; cursor:pointer;">07:30</button>
                  <button onclick="hass.callService('input_datetime','set_datetime',{entity_id:'input_datetime.sveglia_comodino_orario',time:'08:00:00'})" style="background:rgba(30,41,59,0.7); border:1px solid rgba(255,255,255,0.12); color:#cbd5e1; border-radius:14px; font-size:13px; font-weight:800; cursor:pointer;">08:00</button>
                </div>
              `;
            ]]]

      # ---------------------------------------------------------------------
      # RIGA 5: Dock Inferiore (Riepilogo + Conferma Verde Smeraldo)
      # ---------------------------------------------------------------------
      - type: custom:button-card
        entity: input_datetime.sveglia_comodino_orario
        view_layout: { grid-column: "1 / 3", grid-row: "5 / 6" }
